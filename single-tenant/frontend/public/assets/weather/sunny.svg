<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFAE19" />
      <stop offset="60%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5100" />
    </radialGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE685" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FFB300" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF7A00" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Ambient Halo -->
  <circle cx="64" cy="64" r="56" fill="url(#haloGlow)" />
  
  <!-- Sun Rays -->
  <g stroke="#FFAE19" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <line x1="64" y1="12" x2="64" y2="24" />
    <line x1="64" y1="104" x2="64" y2="116" />
    <line x1="12" y1="64" x2="24" y2="64" />
    <line x1="104" y1="64" x2="116" y2="64" />
    <line x1="27.23" y1="27.23" x2="35.72" y2="35.72" />
    <line x1="92.28" y1="92.28" x2="100.77" y2="100.77" />
    <line x1="27.23" y1="100.77" x2="35.72" y2="92.28" />
    <line x1="92.28" y1="35.72" x2="100.77" y2="27.23" />
  </g>

  <!-- Sun Body -->
  <circle cx="64" cy="64" r="32" fill="url(#sunGlow)" filter="url(#softShadow)" />
  
  <!-- Specular Highlight -->
  <ellipse cx="54" cy="52" rx="14" ry="9" transform="rotate(-25 54 52)" fill="#FFF6D1" opacity="0.45" />
</svg>
