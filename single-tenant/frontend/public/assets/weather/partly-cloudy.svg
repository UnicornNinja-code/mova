<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="pcSunGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFAE19" />
      <stop offset="60%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5100" />
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="cloudGradBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="pcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Sun in background -->
  <g transform="translate(18, 6)">
    <g stroke="#FFAE19" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <line x1="48" y1="6" x2="48" y2="14" />
      <line x1="16" y1="16" x2="22" y2="22" />
      <line x1="80" y1="16" x2="74" y2="22" />
      <line x1="6" y1="48" x2="14" y2="48" />
      <line x1="82" y1="48" x2="90" y2="48" />
    </g>
    <circle cx="48" cy="48" r="26" fill="url(#pcSunGlow)" />
    <ellipse cx="40" cy="38" rx="11" ry="7" transform="rotate(-25 40 38)" fill="#FFF6D1" opacity="0.45" />
  </g>

  <!-- Back subtle cloud puff -->
  <ellipse cx="44" cy="74" rx="22" ry="18" fill="url(#cloudGradBack)" opacity="0.5" />

  <!-- Front Volumetric Cloud -->
  <g filter="url(#pcShadow)">
    <path d="M42 98 h54 a20 20 0 0 0 2 -39.9 a28 28 0 0 0 -50.4 -8.1 a22 22 0 0 0 -23.6 22 a22 22 0 0 0 18 26 z" fill="url(#cloudGrad)" />
    <!-- Highlights inside cloud -->
    <ellipse cx="64" cy="54" rx="16" ry="8" fill="#FFFFFF" opacity="0.75" />
    <ellipse cx="44" cy="74" rx="10" ry="6" fill="#FFFFFF" opacity="0.6" />
  </g>
</svg>
