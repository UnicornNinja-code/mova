<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Cloud Gradients -->
    <linearGradient id="frontCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Rain Droplet Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <style>
      @keyframes am-float-cloud {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2px); }
      }
      @keyframes am-rain-fall {
        0% { transform: translate(3px, -6px); opacity: 0; }
        30% { opacity: 1; }
        75% { opacity: 1; }
        100% { transform: translate(-3px, 8px); opacity: 0; }
      }
      .am-rain-cloud { animation: am-float-cloud 3.8s ease-in-out infinite; }
      .am-rain-1 { animation: am-rain-fall 1.05s linear infinite; }
      .am-rain-2 { animation: am-rain-fall 1.05s linear infinite 0.35s; }
      .am-rain-3 { animation: am-rain-fall 1.05s linear infinite 0.7s; }
      .am-rain-4 { animation: am-rain-fall 1.05s linear infinite 0.2s; }
      .am-rain-5 { animation: am-rain-fall 1.05s linear infinite 0.55s; }
    </style>
  </defs>

  <g class="am-rain-cloud" filter="url(#cloudShadow)">
    <path d="M16 36 C11 36 7 32 7 27 C7 22.5 10.5 18.8 15 18.2 C16.5 12 22.2 7.5 29 7.5 C36.5 7.5 42.8 13 44 20.2 C48 20.8 51 24.2 51 28.5 C51 33.2 47.2 37 42.5 37 L16 36 Z"
          fill="url(#frontCloudGrad)" />
    <ellipse cx="29" cy="14" rx="8" ry="4" fill="#FFFFFF" opacity="0.6" />
  </g>

  <g stroke="url(#rainGrad)" stroke-width="3" stroke-linecap="round">
    <line class="am-rain-1" x1="18" y1="42" x2="14" y2="52" />
    <line class="am-rain-2" x1="28" y1="41" x2="24" y2="53" />
    <line class="am-rain-3" x1="38" y1="43" x2="34" y2="54" />
    <line class="am-rain-4" x1="23" y1="53" x2="20" y2="60" />
    <line class="am-rain-5" x1="33" y1="52" x2="30" y2="60" />
  </g>
</svg>