<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-6 -6 76 76" fill="none">
  <defs>
    <!-- Cloud Gradients -->
    <linearGradient id="frontCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Rain Droplet Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>

    <style>
      @keyframes am-float-cloud {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-1.5px); }
      }
      @keyframes am-rain-flow {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-2px, 4px); }
      }
      .am-rain-cloud { animation: am-float-cloud 3.8s ease-in-out infinite; }
      .am-rain-1 { animation: am-rain-flow 1.4s ease-in-out infinite; }
      .am-rain-2 { animation: am-rain-flow 1.4s ease-in-out infinite 0.3s; }
      .am-rain-3 { animation: am-rain-flow 1.4s ease-in-out infinite 0.6s; }
    </style>
  </defs>

  <g class="am-rain-cloud" filter="url(#cloudShadow)">
    <path d="M16 36 C11.5 36 8 32.5 8 28 C8 23.8 11.2 20.2 15.5 19.6 C17 13.5 22.5 9.5 29 9.5 C36 9.5 42 14.5 43.2 21.2 C47 21.8 50 25 50 29 C50 33.5 46.5 36 42 36 L16 36 Z"
          fill="url(#frontCloudGrad)" />
    <ellipse cx="29" cy="15" rx="8" ry="4" fill="#FFFFFF" opacity="0.6" />
  </g>

  <g stroke="url(#rainGrad)" stroke-width="3" stroke-linecap="round">
    <line class="am-rain-1" x1="20" y1="42" x2="16" y2="52" />
    <line class="am-rain-2" x1="31" y1="41" x2="27" y2="53" />
    <line class="am-rain-3" x1="42" y1="42" x2="38" y2="52" />
  </g>
</svg>