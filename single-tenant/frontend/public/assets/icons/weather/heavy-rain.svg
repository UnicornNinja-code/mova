<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-6 -6 76 76" fill="none">
  <defs>
    <!-- Dark Storm Cloud Gradient -->
    <linearGradient id="heavyCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="60%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Heavy Rain Droplet Gradient -->
    <linearGradient id="heavyRainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>

    <style>
      @keyframes am-float-cloud {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-1.5px); }
      }
      @keyframes am-heavy-rain {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-2px, 5px); }
      }
      .am-h-cloud { animation: am-float-cloud 3s ease-in-out infinite; }
      .am-hr-1 { animation: am-heavy-rain 1.1s ease-in-out infinite; }
      .am-hr-2 { animation: am-heavy-rain 1.1s ease-in-out infinite 0.25s; }
      .am-hr-3 { animation: am-heavy-rain 1.1s ease-in-out infinite 0.5s; }
    </style>
  </defs>

  <g class="am-h-cloud" filter="url(#cloudShadow)">
    <path d="M16 35 C11.5 35 8 31.5 8 27 C8 22.8 11.2 19.2 15.5 18.6 C17 12.5 22.5 8.5 29 8.5 C36 8.5 42 13.5 43.2 20.2 C47 20.8 50 24 50 28 C50 32.5 46.5 35 42 35 L16 35 Z"
          fill="url(#heavyCloudGrad)" />
    <ellipse cx="29" cy="14" rx="8" ry="4" fill="#CBD5E1" opacity="0.4" />
  </g>

  <!-- Triple Heavy Rain Streaks -->
  <g stroke="url(#heavyRainGrad)" stroke-width="3.5" stroke-linecap="round">
    <line class="am-hr-1" x1="18" y1="41" x2="13" y2="53" />
    <line class="am-hr-2" x1="28" y1="40" x2="23" y2="54" />
    <line class="am-hr-3" x1="38" y1="41" x2="33" y2="53" />
    <line class="am-hr-1" x1="48" y1="42" x2="43" y2="52" />
  </g>
</svg>