<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Storm Cloud Gradients -->
    <linearGradient id="stormCloudFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Rain Droplet Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <style>
      @keyframes am-storm-cloud-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      @keyframes am-heavy-rain-fall {
        0% { transform: translate(4px, -8px); opacity: 0; }
        25% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(-4px, 12px); opacity: 0; }
      }
      .am-heavy-cloud {
        transform-origin: 32px 24px;
        animation: am-storm-cloud-pulse 3s ease-in-out infinite;
      }
      .am-hrain-1 { animation: am-heavy-rain-fall 0.75s linear infinite; }
      .am-hrain-2 { animation: am-heavy-rain-fall 0.75s linear infinite 0.25s; }
      .am-hrain-3 { animation: am-heavy-rain-fall 0.75s linear infinite 0.5s; }
      .am-hrain-4 { animation: am-heavy-rain-fall 0.75s linear infinite 0.15s; }
      .am-hrain-5 { animation: am-heavy-rain-fall 0.75s linear infinite 0.4s; }
      .am-hrain-6 { animation: am-heavy-rain-fall 0.75s linear infinite 0.65s; }
    </style>
  </defs>

  <g class="am-heavy-cloud" filter="url(#cloudShadow)">
    <path d="M16 35 C11 35 7 31 7 26 C7 21.5 10.5 17.8 15 17.2 C16.5 11 22.2 6.5 29 6.5 C36.5 6.5 42.8 12 44 19.2 C48 19.8 51 23.2 51 27.5 C51 32.2 47.2 36 42.5 36 L16 35 Z"
          fill="url(#stormCloudFront)" />
    <ellipse cx="29" cy="13" rx="8" ry="4" fill="#94A3B8" opacity="0.4" />
  </g>

  <g stroke="url(#rainGrad)" stroke-width="3.5" stroke-linecap="round">
    <line class="am-hrain-1" x1="16" y1="40" x2="11" y2="53" />
    <line class="am-hrain-2" x1="24" y1="39" x2="19" y2="54" />
    <line class="am-hrain-3" x1="32" y1="40" x2="27" y2="54" />
    <line class="am-hrain-4" x1="40" y1="41" x2="35" y2="55" />
    <line class="am-hrain-5" x1="20" y1="53" x2="16" y2="62" />
    <line class="am-hrain-6" x1="33" y1="52" x2="29" y2="62" />
  </g>
</svg>