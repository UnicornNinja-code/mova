<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-6 -6 76 76" fill="none">
  <defs>
    <!-- Fog Cloud Gradient -->
    <linearGradient id="fogCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Fog Lines Gradient -->
    <linearGradient id="fogBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.3" />
      <stop offset="25%" stop-color="#CBD5E1" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#CBD5E1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>

    <style>
      @keyframes am-fog-cloud {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-1.5px); }
      }
      @keyframes am-fog-drift-1 {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(3px); }
      }
      @keyframes am-fog-drift-2 {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-3px); }
      }
      .am-fog-c { animation: am-fog-cloud 4s ease-in-out infinite; }
      .am-fog-line-1 { animation: am-fog-drift-1 3.5s ease-in-out infinite; }
      .am-fog-line-2 { animation: am-fog-drift-2 3.5s ease-in-out infinite 0.5s; }
      .am-fog-line-3 { animation: am-fog-drift-1 3.5s ease-in-out infinite 1s; }
    </style>
  </defs>

  <g class="am-fog-c" filter="url(#cloudShadow)">
    <path d="M16 38 C11.5 38 8 34.5 8 30 C8 25.8 11.2 22.2 15.5 21.6 C17 15.5 22.5 11.5 29 11.5 C36 11.5 42 16.5 43.2 23.2 C47 23.8 50 27 50 31 C50 35.5 46.5 38 42 38 L16 38 Z"
          fill="url(#fogCloudGrad)" />
    <ellipse cx="29" cy="17" rx="8" ry="4" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Fog Horizontal Drift Bars -->
  <g stroke="url(#fogBarGrad)" stroke-width="3" stroke-linecap="round">
    <line class="am-fog-line-1" x1="12" y1="44" x2="52" y2="44" />
    <line class="am-fog-line-2" x1="16" y1="50" x2="48" y2="50" />
    <line class="am-fog-line-3" x1="20" y1="56" x2="44" y2="56" />
  </g>
</svg>