<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Cloud Gradients -->
    <linearGradient id="frontCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Fog Gradient -->
    <linearGradient id="fogGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#CBD5E1" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#E2E8F0" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <style>
      @keyframes am-float-cloud {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(2px); }
      }
      @keyframes am-fog-drift-1 {
        0%, 100% { transform: translateX(0px); opacity: 0.8; }
        50% { transform: translateX(4px); opacity: 1; }
      }
      @keyframes am-fog-drift-2 {
        0%, 100% { transform: translateX(0px); opacity: 0.9; }
        50% { transform: translateX(-4px); opacity: 0.65; }
      }
      .am-fog-cloud { animation: am-float-cloud 5s ease-in-out infinite; }
      .am-fog-1 { animation: am-fog-drift-1 5s ease-in-out infinite; }
      .am-fog-2 { animation: am-fog-drift-2 4.2s ease-in-out infinite 0.6s; }
      .am-fog-3 { animation: am-fog-drift-1 5.8s ease-in-out infinite 1.2s; }
    </style>
  </defs>

  <g class="am-fog-cloud" filter="url(#cloudShadow)" opacity="0.9">
    <path d="M18 36 C14 36 10.8 32.8 10.8 28.8 C10.8 25.2 13.6 22.2 17.2 21.8 C18.4 16.8 23 13 28.5 13 C34.5 13 39.5 17.5 40.5 23.2 C43.8 23.8 46.2 26.5 46.2 30 C46.2 33.8 43.2 36.8 39.5 36.8 L18 36 Z"
          fill="url(#frontCloudGrad)" />
  </g>
  <rect class="am-fog-1" x="8" y="40" width="48" height="4.5" rx="2.25" fill="url(#fogGrad)" />
  <rect class="am-fog-2" x="14" y="47" width="38" height="4" rx="2" fill="url(#fogGrad)" />
  <rect class="am-fog-3" x="10" y="53" width="44" height="3.5" rx="1.75" fill="url(#fogGrad)" />
</svg>