<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-6 -6 76 76" fill="none">
  <defs>
    <!-- Sun Gradients -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sunCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="sunRay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Cloud Gradients -->
    <linearGradient id="frontCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>
    <filter id="sunDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#D97706" flood-opacity="0.4" />
    </filter>

    <style>
      @keyframes am-spin-sun {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes am-float-cloud {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(2.5px); }
      }
      .am-sun-back {
        transform-origin: 32px 32px;
        animation: am-spin-sun 22s linear infinite;
      }
      .am-cloud-front {
        animation: am-float-cloud 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="am-sun-back" transform="translate(13, -7) scale(0.72)" filter="url(#sunDropShadow)">
    <circle cx="32" cy="32" r="24" fill="url(#sunGlow)" />
    <path d="M32 6 L32 12" stroke="url(#sunRay)" stroke-width="4" stroke-linecap="round" />
    <path d="M52 32 L58 32" stroke="url(#sunRay)" stroke-width="4" stroke-linecap="round" />
    <path d="M46 18 L50 14" stroke="url(#sunRay)" stroke-width="4" stroke-linecap="round" />
    <path d="M46 46 L50 50" stroke="url(#sunRay)" stroke-width="4" stroke-linecap="round" />
    <path d="M18 18 L14 14" stroke="url(#sunRay)" stroke-width="4" stroke-linecap="round" />
    <path d="M18 46 L14 50" stroke="url(#sunRay)" stroke-width="4" stroke-linecap="round" />
    <circle cx="32" cy="32" r="14" fill="url(#sunCore)" />
    <ellipse cx="28" cy="28" rx="5" ry="3" transform="rotate(-30 28 28)" fill="#FFFFFF" opacity="0.45" />
  </g>

  <g class="am-cloud-front" filter="url(#cloudShadow)">
    <path d="M18 47 C13.5 47 10 43.5 10 39 C10 34.8 13.2 31.2 17.5 30.6 C19 24.5 24.5 20.5 31 20.5 C38 20.5 44 25.5 45.2 32.2 C49 32.8 52 36 52 40 C52 44.5 48.5 47 44 47 L18 47 Z"
          fill="url(#frontCloudGrad)" />
    <ellipse cx="31" cy="26" rx="8" ry="4" fill="#FFFFFF" opacity="0.6" />
    <ellipse cx="19" cy="35" rx="5" ry="3" fill="#FFFFFF" opacity="0.5" />
  </g>
</svg>