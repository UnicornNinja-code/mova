<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-6 -6 76 76" fill="none">
  <defs>
    <!-- Dark Storm Cloud Gradients -->
    <linearGradient id="stormCloudFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Rain Droplet Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Lightning Gradient -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes am-storm-cloud-pulse {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1.5px); }
      }
      @keyframes am-lightning-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #FACC15); }
        50% { transform: scale(1.04); filter: drop-shadow(0 0 6px #FACC15); }
      }
      @keyframes am-rain-fall {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-2px, 4px); }
      }
      .am-thunder-cloud { animation: am-storm-cloud-pulse 3s ease-in-out infinite; }
      .am-bolt { transform-origin: 29px 44px; animation: am-lightning-pulse 2s ease-in-out infinite; }
      .am-t-rain-1 { animation: am-rain-fall 1.1s ease-in-out infinite; }
      .am-t-rain-2 { animation: am-rain-fall 1.1s ease-in-out infinite 0.3s; }
    </style>
  </defs>

  <g class="am-thunder-cloud" filter="url(#cloudShadow)">
    <path d="M16 34 C11 34 7 30 7 25 C7 20.5 10.5 16.8 15 16.2 C16.5 10 22.2 5.5 29 5.5 C36.5 5.5 42.8 11 44 18.2 C48 18.8 51 22.2 51 26.5 C51 31.2 47.2 35 42.5 35 L16 34 Z"
          fill="url(#stormCloudFront)" />
    <ellipse cx="29" cy="12" rx="8" ry="4" fill="#94A3B8" opacity="0.4" />
  </g>

  <g stroke="url(#rainGrad)" stroke-width="2.5" stroke-linecap="round">
    <line class="am-t-rain-1" x1="15" y1="40" x2="11" y2="48" />
    <line class="am-t-rain-2" x1="43" y1="40" x2="39" y2="49" />
  </g>

  <polygon class="am-bolt" points="30,28 22,42 28,42 24,56 38,39 31,39 36,28"
           fill="url(#lightningGrad)" stroke="#FFFFFF" stroke-width="0.75" filter="url(#boltGlow)" />
</svg>