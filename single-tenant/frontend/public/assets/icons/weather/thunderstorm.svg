<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Storm Cloud Gradients -->
    <linearGradient id="stormCloudFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="60%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Rain Droplet Gradient -->
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Lightning Gradient -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes am-storm-cloud-pulse {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1.5px); }
      }
      @keyframes am-lightning-flash {
        0%, 80%, 100% { opacity: 0; transform: scale(0.95); }
        83% { opacity: 1; transform: scale(1.06); }
        85% { opacity: 0.25; }
        88% { opacity: 1; transform: scale(1.03); }
        92% { opacity: 0; }
      }
      @keyframes am-rain-fall {
        0% { transform: translate(2px, -5px); opacity: 0; }
        30% { opacity: 1; }
        75% { opacity: 1; }
        100% { transform: translate(-2px, 7px); opacity: 0; }
      }
      .am-thunder-cloud { animation: am-storm-cloud-pulse 3s ease-in-out infinite; }
      .am-bolt { transform-origin: 30px 42px; animation: am-lightning-flash 3.5s ease-in-out infinite; }
      .am-t-rain-1 { animation: am-rain-fall 0.9s linear infinite; }
      .am-t-rain-2 { animation: am-rain-fall 0.9s linear infinite 0.4s; }
    </style>
  </defs>

  <g class="am-thunder-cloud" filter="url(#cloudShadow)">
    <path d="M16 34 C11 34 7 30 7 25 C7 20.5 10.5 16.8 15 16.2 C16.5 10 22.2 5.5 29 5.5 C36.5 5.5 42.8 11 44 18.2 C48 18.8 51 22.2 51 26.5 C51 31.2 47.2 35 42.5 35 L16 34 Z"
          fill="url(#stormCloudFront)" />
    <ellipse cx="29" cy="12" rx="8" ry="4" fill="#94A3B8" opacity="0.4" />
  </g>

  <g stroke="url(#rainGrad)" stroke-width="2.5" stroke-linecap="round">
    <line class="am-t-rain-1" x1="14" y1="40" x2="10" y2="48" />
    <line class="am-t-rain-2" x1="42" y1="40" x2="38" y2="50" />
  </g>

  <polygon class="am-bolt" points="30,30 22,44 28,44 24,59 38,41 31,41 36,30"
           fill="url(#lightningGrad)" stroke="#FFFFFF" stroke-width="0.75" filter="url(#boltGlow)" />
</svg>