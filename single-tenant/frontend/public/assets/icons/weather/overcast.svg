<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-6 -6 76 76" fill="none">
  <defs>
    <!-- Darker Back Cloud Gradient -->
    <linearGradient id="backOvercastGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="70%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Front Cloud Gradient -->
    <linearGradient id="frontOvercastGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="65%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <style>
      @keyframes am-float-front {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(2.5px); }
      }
      @keyframes am-float-back {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-2px); }
      }
      .am-oc-back { animation: am-float-back 6s ease-in-out infinite; }
      .am-oc-front { animation: am-float-front 4.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Back Darker Cloud -->
  <g class="am-oc-back" filter="url(#cloudShadow)" transform="translate(10, -8) scale(0.85)">
    <path d="M18 47 C13.5 47 10 43.5 10 39 C10 34.8 13.2 31.2 17.5 30.6 C19 24.5 24.5 20.5 31 20.5 C38 20.5 44 25.5 45.2 32.2 C49 32.8 52 36 52 40 C52 44.5 48.5 47 44 47 L18 47 Z"
          fill="url(#backOvercastGrad)" />
  </g>

  <!-- Front Lighter Cloud -->
  <g class="am-oc-front" filter="url(#cloudShadow)">
    <path d="M16 48 C11.5 48 8 44.5 8 40 C8 35.8 11.2 32.2 15.5 31.6 C17 25.5 22.5 21.5 29 21.5 C36 21.5 42 26.5 43.2 33.2 C47 33.8 50 37 50 41 C50 45.5 46.5 48 42 48 L16 48 Z"
          fill="url(#frontOvercastGrad)" />
    <ellipse cx="29" cy="27" rx="8" ry="4" fill="#FFFFFF" opacity="0.6" />
    <ellipse cx="17" cy="36" rx="5" ry="3" fill="#FFFFFF" opacity="0.5" />
  </g>
</svg>