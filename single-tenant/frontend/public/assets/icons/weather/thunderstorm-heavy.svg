<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-6 -6 76 76" fill="none">
  <defs>
    <!-- Dark Storm Cloud Gradients -->
    <linearGradient id="heavyStormCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Heavy Rain Droplet Gradient -->
    <linearGradient id="heavyRainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Lightning Gradient -->
    <linearGradient id="heavyBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes am-heavy-cloud-pulse {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1.5px); }
      }
      @keyframes am-heavy-bolt {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #FACC15); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 8px #FACC15); }
      }
      @keyframes am-heavy-t-rain {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-2px, 5px); }
      }
      .am-h-thunder-cloud { animation: am-heavy-cloud-pulse 2.8s ease-in-out infinite; }
      .am-h-bolt { transform-origin: 30px 44px; animation: am-heavy-bolt 1.8s ease-in-out infinite; }
      .am-ht-rain-1 { animation: am-heavy-t-rain 1s ease-in-out infinite; }
      .am-ht-rain-2 { animation: am-heavy-t-rain 1s ease-in-out infinite 0.25s; }
      .am-ht-rain-3 { animation: am-heavy-t-rain 1s ease-in-out infinite 0.5s; }
    </style>
  </defs>

  <g class="am-h-thunder-cloud" filter="url(#cloudShadow)">
    <path d="M16 33 C11 33 7 29 7 24 C7 19.5 10.5 15.8 15 15.2 C16.5 9 22.2 4.5 29 4.5 C36.5 4.5 42.8 10 44 17.2 C48 17.8 51 21.2 51 25.5 C51 30.2 47.2 34 42.5 34 L16 33 Z"
          fill="url(#heavyStormCloud)" />
    <ellipse cx="29" cy="11" rx="8" ry="4" fill="#64748B" opacity="0.5" />
  </g>

  <!-- Heavy Rain Streaks -->
  <g stroke="url(#heavyRainGrad)" stroke-width="3" stroke-linecap="round">
    <line class="am-ht-rain-1" x1="14" y1="39" x2="10" y2="50" />
    <line class="am-ht-rain-2" x1="25" y1="41" x2="21" y2="52" />
    <line class="am-ht-rain-3" x1="47" y1="39" x2="43" y2="50" />
  </g>

  <!-- Dual Volumetric Lightning Bolt -->
  <polygon class="am-h-bolt" points="34,26 25,41 31,41 27,57 42,38 35,38 41,26"
           fill="url(#heavyBoltGrad)" stroke="#FFFFFF" stroke-width="0.75" filter="url(#boltGlow)" />
</svg>