<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-6 -6 76 76" fill="none">
  <defs>
    <!-- Moon Gradients -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="moonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="moonDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>

    <style>
      @keyframes am-float-moon {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-2px) rotate(2deg); }
      }
      @keyframes am-twinkle {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      .am-moon-container {
        transform-origin: 32px 32px;
        animation: am-float-moon 6s ease-in-out infinite;
      }
      .am-star-1 { transform-origin: 18px 16px; animation: am-twinkle 3s ease-in-out infinite; }
      .am-star-2 { transform-origin: 48px 46px; animation: am-twinkle 3s ease-in-out infinite 1.5s; }
    </style>
  </defs>

  <circle cx="32" cy="32" r="28" fill="url(#moonGlow)" />

  <g class="am-moon-container" filter="url(#moonDropShadow)">
    <path d="M38 14 C27 14 18 23 18 34 C18 45 27 54 38 54 C42.5 54 46.5 52.5 49.8 50 C40 48.5 32.5 40 32.5 30 C32.5 22.8 36.5 16.5 42.5 14.5 C41 14.2 39.5 14 38 14 Z"
          fill="url(#moonBody)" />
    <!-- Moon Craters -->
    <circle cx="28" cy="30" r="2.5" fill="#CBD5E1" opacity="0.6" />
    <circle cx="33" cy="42" r="3.2" fill="#CBD5E1" opacity="0.6" />
    <circle cx="25" cy="38" r="1.8" fill="#CBD5E1" opacity="0.5" />
  </g>

  <!-- Twinkling Micro Stars -->
  <g class="am-star-1" fill="#FEF08A">
    <polygon points="18,13 19.5,15.5 22,16 19.5,16.5 18,19 16.5,16.5 14,16 16.5,15.5" />
  </g>
  <g class="am-star-2" fill="#FEF08A">
    <polygon points="48,43 49.2,45.2 51.5,46 49.2,46.8 48,49 46.8,46.8 44.5,46 46.8,45.2" />
  </g>
</svg>