<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Moon Gradients -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0E7FF" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <style>
      @keyframes am-float-moon {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-2px) rotate(2deg); }
      }
      @keyframes am-twinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.25); }
      }
      .am-moon-body {
        transform-origin: 34px 36px;
        animation: am-float-moon 5s ease-in-out infinite;
      }
      .am-star-1 { transform-origin: 12px 16px; animation: am-twinkle 2.5s ease-in-out infinite; }
      .am-star-2 { transform-origin: 46px 16px; animation: am-twinkle 3.2s ease-in-out infinite 0.8s; }
      .am-star-3 { transform-origin: 50px 45px; animation: am-twinkle 2.8s ease-in-out infinite 1.5s; }
      .am-star-4 { transform-origin: 16px 46px; animation: am-twinkle 3.5s ease-in-out infinite 0.4s; }
    </style>
  </defs>

  <circle cx="32" cy="32" r="26" fill="url(#moonGlow)" />
  <g fill="#FDE68A">
    <circle cx="12" cy="16" r="1.5" class="am-star-1" />
    <path d="M46 12 L47.5 15 L50.5 16.5 L47.5 18 L46 21 L44.5 18 L41.5 16.5 L44.5 15 Z" class="am-star-2" />
    <path d="M50 42 L51 44 L53 45 L51 46 L50 48 L49 46 L47 45 L49 44 Z" class="am-star-3" />
    <circle cx="16" cy="46" r="1.2" class="am-star-4" />
  </g>
  <g class="am-moon-body">
    <path d="M38 12 C24.7 12 14 22.7 14 36 C14 49.3 24.7 60 38 60 C43.2 60 48 58.4 52 55.6 C41.2 54 33 44.8 33 33.6 C33 22.4 41.2 13.2 52 11.6 C48 9.3 43.2 12 38 12 Z" 
          fill="url(#moonGrad)" filter="url(#cloudShadow)" />
    <circle cx="28" cy="34" r="3" fill="#94A3B8" opacity="0.35" />
    <circle cx="24" cy="44" r="2" fill="#94A3B8" opacity="0.35" />
    <circle cx="34" cy="46" r="2.5" fill="#94A3B8" opacity="0.35" />
  </g>
</svg>