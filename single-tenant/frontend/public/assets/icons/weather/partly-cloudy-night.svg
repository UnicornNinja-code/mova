<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-6 -6 76 76" fill="none">
  <defs>
    <!-- Moon Gradients -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="moonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Cloud Gradients -->
    <linearGradient id="nightCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="65%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
    <filter id="moonDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>

    <style>
      @keyframes am-float-moon {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-1.5px) rotate(1.5deg); }
      }
      @keyframes am-float-cloud {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(2px); }
      }
      .am-moon-back {
        animation: am-float-moon 5s ease-in-out infinite;
      }
      .am-cloud-night {
        animation: am-float-cloud 4.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="am-moon-back" transform="translate(14, -6) scale(0.72)" filter="url(#moonDropShadow)">
    <circle cx="32" cy="32" r="24" fill="url(#moonGlow)" />
    <path d="M38 14 C27 14 18 23 18 34 C18 45 27 54 38 54 C42.5 54 46.5 52.5 49.8 50 C40 48.5 32.5 40 32.5 30 C32.5 22.8 36.5 16.5 42.5 14.5 C41 14.2 39.5 14 38 14 Z"
          fill="url(#moonBody)" />
    <circle cx="28" cy="30" r="2.5" fill="#CBD5E1" opacity="0.6" />
    <circle cx="33" cy="42" r="3.2" fill="#CBD5E1" opacity="0.6" />
  </g>

  <g class="am-cloud-night" filter="url(#cloudShadow)">
    <path d="M18 47 C13.5 47 10 43.5 10 39 C10 34.8 13.2 31.2 17.5 30.6 C19 24.5 24.5 20.5 31 20.5 C38 20.5 44 25.5 45.2 32.2 C49 32.8 52 36 52 40 C52 44.5 48.5 47 44 47 L18 47 Z"
          fill="url(#nightCloudGrad)" />
    <ellipse cx="31" cy="26" rx="8" ry="4" fill="#F1F5F9" opacity="0.4" />
  </g>
</svg>