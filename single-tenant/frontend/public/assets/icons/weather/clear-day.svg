<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="-6 -6 76 76" fill="none">
  <defs>
    <!-- Sun Gradients -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sunCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="sunRay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Filters -->
    <filter id="sunDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#D97706" flood-opacity="0.4" />
    </filter>

    <style>
      @keyframes am-spin-sun {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes am-pulse-sun {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      .am-sun-rays {
        transform-origin: 32px 32px;
        animation: am-spin-sun 20s linear infinite;
      }
      .am-sun-core {
        transform-origin: 32px 32px;
        animation: am-pulse-sun 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <circle cx="32" cy="32" r="28" fill="url(#sunGlow)" />
  <g class="am-sun-rays" filter="url(#sunDropShadow)">
    <path d="M32 5 L32 10" stroke="url(#sunRay)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M32 54 L32 59" stroke="url(#sunRay)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M5 32 L10 32" stroke="url(#sunRay)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M54 32 L59 32" stroke="url(#sunRay)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M12.9 12.9 L16.5 16.5" stroke="url(#sunRay)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M47.5 47.5 L51.1 51.1" stroke="url(#sunRay)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M12.9 51.1 L16.5 47.5" stroke="url(#sunRay)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M47.5 16.5 L51.1 12.9" stroke="url(#sunRay)" stroke-width="3.5" stroke-linecap="round" />
  </g>
  <g class="am-sun-core">
    <circle cx="32" cy="32" r="15" fill="url(#sunCore)" filter="url(#sunDropShadow)" />
    <ellipse cx="27" cy="27" rx="6" ry="3.5" transform="rotate(-30 27 27)" fill="#FFFFFF" opacity="0.45" />
  </g>
</svg>