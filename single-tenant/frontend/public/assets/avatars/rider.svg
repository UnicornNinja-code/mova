<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="riderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="riderCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#riderBg)" />
  
  <!-- Outer Rim Glow -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.4" />

  <!-- Rider Body / Jacket -->
  <path d="M22 88 C22 72, 34 68, 50 68 C66 68, 78 72, 78 88 Z" fill="#0F172A" />
  <!-- Jacket Collar / Zipper -->
  <polygon points="50,68 45,78 55,78" fill="#F97316" />
  <line x1="50" y1="78" x2="50" y2="88" stroke="#F97316" stroke-width="2" />

  <!-- Head / Face -->
  <circle cx="50" cy="48" r="18" fill="url(#skin)" />

  <!-- Coffee Cap / Helm -->
  <path d="M30 40 Q50 20 70 40 Z" fill="url(#riderCap)" />
  <rect x="28" y="38" width="44" height="6" rx="3" fill="#EA580C" />
  <!-- Cap Visor -->
  <path d="M65 42 L80 43 L72 40 Z" fill="#C2410C" />

  <!-- Eyes & Smile -->
  <circle cx="44" cy="47" r="2.5" fill="#1E293B" />
  <circle cx="56" cy="47" r="2.5" fill="#1E293B" />
  <path d="M46 54 Q50 58 54 54" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Badge / Coffee Icon on Cap -->
  <circle cx="50" cy="32" r="3.5" fill="#FFFFFF" />
  <path d="M48 32 C48 30 52 30 52 32 Z" fill="#F97316" />
</svg>
