openapi: 3.0.3
info:
  title: 'MOVA DSS Engine & Fleet Operations API (Single-Tenant)'
  description: "## Coffee Operational Zone Intelligence System (COZIS / MOVA)\n### Enterprise Single-Tenant Spatial Decision Support System & Fleet Orchestration Contract\n\nWelcome to the **MOVA DSS Single-Tenant API Specification**. This document serves as the Single Source of Truth (SSOT) contract between backend micro-services, spatial calculation engines, background queue workers, and modern web/mobile frontend applications.\n\n---\n\n### 🏛️ System Architecture Overview\nMOVA is an intelligent geospatial Decision Support System (DSS) tailored for mobile retail coffee fleets. It operates on a high-concurrency Node.js + Express 5 runtime backed by PostgreSQL with PostGIS extensions, Redis caching & BullMQ distributed job queues, and Socket.io for real-time Location-Based Services (LBS).\n\n```mermaid\ngraph TD\n    Client[Web / Mobile Client] -->|HTTPS REST / JWT| Gateway[Express 5 API Gateway]\n    Client -->|WSS Socket.io| LBS[LBS Real-Time Gateway]\n    Gateway --> Auth[4-Role RBAC Middleware]\n    Gateway --> DSS[BWM-TOPSIS Solver Engine]\n    Gateway --> Fleet[5-Min Armada Lock Queue]\n    Gateway --> GIS[PostGIS Spatial Repository]\n    DSS --> Solver[LP Linear Programming Worker]\n    Fleet --> Redis[(Redis Key-Value & Lock)]\n    GIS --> DB[(PostgreSQL + PostGIS)]\n```\n\n---\n\n### 👥 Multi-Role RBAC & Hierarchy Guard\nThe system enforces strict 4-Role Role-Based Access Control (RBAC):\n- **`SUPERADMIN`**: Complete administrative authority, polygon creation, BWM weight calibration, manual sync triggers, and user hierarchy management.\n- **`MANAGEMENT`**: Executive oversight, multi-zone KPI analytics, revenue reporting, fleet status inspection, and supervisor account provisioning.\n- **`SUPERVISOR`**: Field operations commander, real-time rider dispatching, TOPSIS recommendation approval, manual override, and fleet check-in audits.\n- **`RIDER`**: Field mobile operator, 5-minute armada holding/claiming, geofence check-in, selling spot claiming, and POS transactions recording.\n\n> **Hierarchy Guard Rule**: A user cannot create or modify an account with a role equal to or higher than their own (e.g., `MANAGEMENT` cannot create or edit `SUPERADMIN` accounts).\n\n---\n\n### 🧠 Decision Support System (DSS) Pipeline\nMOVA utilizes a **Hybrid Multi-Criteria Decision Making (MCDM)** pipeline:\n1. **Best-Worst Method (BWM)**: Computes optimal criteria weights ($w_1, \\dots, w_6$) using a Linear Programming (LP) solver with consistency ratio ($CR \\le 0.10$).\n2. **TOPSIS Ranking**: Evaluates operational zones based on 6 dynamic criteria:\n   - **$C_1$ Crowd Density**: Spatial POI concentration with time-decay weights (pagi, siang, sore, malam).\n   - **$C_2$ Weather Condition**: Real-time Open-Meteo precipitation and temperature suitability.\n   - **$C_3$ Event Proximity**: Temporal public events & gatherings within 1km buffer.\n   - **$C_4$ Road Accessibility**: Protocol and arterial road access (excluding toll roads).\n   - **$C_5$ Hub Proximity**: Haversine/geodesic distance from central operational warehouse.\n   - **$C_6$ Competitor Density**: Proximity penalty based on nearby commercial coffee vendors.\n\n---\n\n### 🛵 5-Minute Armada Reservation Lock Workflow\nTo prevent race conditions during morning shift check-in:\n1. Rider initiates `POST /api/rider/hold-armada` or `POST /api/rider-operational/hold-armada`.\n2. Redis acquires a distributed reservation lock with a strict 300-second TTL (ticket-booking style).\n3. BullMQ scheduler automatically releases the unit back to `AVAILABLE` if physical check-in is not finalized within 5 minutes.\n4. Rider confirms physical inspection via `POST /api/rider/claim-armada`, converting the state to `IN_USE`.\n\n---\n\n### 📦 Standard API Response Envelopes\nAll REST endpoints adhere to a standardized JSend-compliant envelope structure:\n\n#### Success Response (`200 OK` / `201 Created`)\n```json\n{\n  \"status\": \"success\",\n  \"message\": \"Resource retrieved successfully\",\n  \"data\": { ... },\n  \"meta\": {\n    \"page\": 1,\n    \"limit\": 20,\n    \"total\": 100\n  }\n}\n```\n\n#### Error Response (`4xx` / `5xx`)\n```json\n{\n  \"status\": \"error\",\n  \"message\": \"Validation failed on payload coordinates\",\n  \"error\": {\n    \"code\": \"SPATIAL_VALIDATION_ERROR\",\n    \"details\": [\"Polygon intersects with restricted toll road corridor\"]\n  },\n  \"timestamp\": \"2026-09-16T09:17:32.000Z\"\n}\n```\n"
  version: 1.0.0
  termsOfService: 'https://kopikeliling.com/terms'
  contact:
    name: 'MOVA Engineering Team'
    email: engineering@kopikeliling.com
    url: 'https://kopikeliling.com/developer'
  license:
    name: 'Proprietary / MOVA Enterprise License'
    url: 'https://kopikeliling.com/license'
servers:
  -
    url: 'http://localhost:8090/api'
    description: 'Local Single-Tenant Development Server (Express 5 Backend on Port 8090)'
  -
    url: 'http://localhost:8080/api'
    description: 'Local Docker / Staging Environment Gateway'
  -
    url: /api
    description: 'Production Gateway (Relative URL Routing)'
tags:
  -
    name: Auth
    description: 'Authentication, JWT token issuance, session refresh, activation tokens & password recovery'
  -
    name: 'User Account'
    description: 'User account management, profile settings, and role hierarchy enforcement guard'
  -
    name: 'Zone Master'
    description: 'Spatial operational geofences, PostGIS polygon validation, self-intersection & overlap checks'
  -
    name: 'DSS Engine'
    description: 'Hybrid BWM (LP Solver) and TOPSIS multi-criteria decision engine, active weight configs & historical snapshots'
  -
    name: 'POI & Spatial'
    description: 'Point of Interest (POI) catalog, time-based crowd weights, Overpass OSM sync, and spatial density aggregation'
  -
    name: Competitors
    description: 'Commercial competitor surveys, spatial density scoring (C6), and market penetration analysis'
  -
    name: 'Candidate Locations'
    description: 'High-potential candidate selling spots, in-zone spatial clustering, and spot-level TOPSIS ranking'
  -
    name: 'Weather & Roads'
    description: 'Open-Meteo real-time weather suitability (C2), protocol road accessibility (C4), and toll road restrictions'
  -
    name: 'Armada Fleet'
    description: 'Master fleet units, 5-minute ticket reservation lock, maintenance status, and vehicle telemetry'
  -
    name: 'Rider Operations'
    description: 'Daily rider operational lifecycle: armada reservation, claim, GPS geofence check-in, POS sales, and checkout'
  -
    name: 'Distribution & Plotting'
    description: 'FIFO rider duty queue, automatic DSS TOPSIS zone distribution, supervisor manual overrides, and shift history'
  -
    name: 'Catalog & Products'
    description: 'Product menu items, pricing configuration, stock status, and inventory availability'
  -
    name: 'Sales & Revenue'
    description: 'Daily field sales transactions, cashier ledger, revenue density by zone, and performance reports'
  -
    name: 'LBS Telemetry'
    description: 'Location-Based Services telemetry, 30s GPS pings, multi-rider distance matrix, and geofence deviation detection'
  -
    name: 'Dashboard & Analytics'
    description: 'Executive & supervisor KPI dashboards, sales trends, fleet utilization, and real-time quick alerts'
  -
    name: 'Audit & Settings'
    description: 'Immutable system activity audit trail, central hub configuration, basemap tile providers, and system parameters'
paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: 'User Login (Email or Username + Password)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: 'Email address or username (case-insensitive)'
                  example: superadmin@kopikeliling.com
                password:
                  type: string
                  format: password
                  example: password123
                turnstileToken:
                  type: string
                  description: 'Cloudflare Turnstile token generated by client widget'
                  example: 0.k2...dummy_token
      responses:
        '200':
          description: 'Login Successful (Returns JWT Access Token & User Profile)'
        '400':
          description: 'Bad Request / CAPTCHA Verification Failed'
        '401':
          description: 'Invalid Credentials or Inactive Account'
        '429':
          description: 'Too Many Requests (Rate Limit Exceeded)'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: postAuthLogin
  /auth/register:
    post:
      tags:
        - Auth
      summary: 'Register New User (Restricted by Role Hierarchy Guard)'
      security:
        -
          BearerAuth: []
      description: "SUPERADMIN can create any role. MANAGEMENT can only create MANAGEMENT, SUPERVISOR, or RIDER (Cannot create SUPERADMIN).\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        '201':
          description: 'User Created Successfully'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden (Management attempted to create Superadmin)'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: postAuthRegister
  /auth/me:
    get:
      tags:
        - Auth
      summary: 'Get Authenticated User Profile & Active Session'
      security:
        -
          BearerAuth: []
      responses:
        '200':
          description: 'Current User Profile'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: getAuthMe
  /auth/refresh-token:
    post:
      tags:
        - Auth
      summary: 'Refresh Expired Access Token'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 'New Access Token Issued'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: postAuthRefresh-token
  /auth/logout:
    post:
      tags:
        - Auth
      summary: 'Invalidate Session & Revoke Token'
      security:
        -
          BearerAuth: []
      responses:
        '200':
          description: 'Logged Out Successfully'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: postAuthLogout
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: 'Request Password Reset Link / Token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: 'Password Reset Token Generated'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: postAuthForgot-password
  /auth/reset-password:
    post:
      tags:
        - Auth
      summary: 'Submit New Password with Reset Token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: 'Password Reset Successfully'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: postAuthReset-password
  /auth/first-login:
    post:
      tags:
        - Auth
      summary: 'Force Password Change on First Superadmin Login'
      security:
        -
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - new_password
              properties:
                new_password:
                  type: string
                  format: password
                  example: SuperSecureAdmin2026!
      responses:
        '200':
          description: 'Password Updated and first_login flag set to false'
        '400':
          description: 'Validation Error'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: postAuthFirst-login
  /auth/activate:
    post:
      tags:
        - Auth
      summary: 'Activate User Account via Invitation Token with Birth Date'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - email
                - password
                - birth_date
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                birth_date:
                  type: string
                  format: date
                  example: '1995-08-17'
      responses:
        '200':
          description: 'Account Activated Successfully'
        '400':
          description: 'Invalid or Expired Activation Token'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: postAuthActivate
  /users:
    get:
      tags:
        - 'User Account'
      summary: 'List All User Accounts (Filter by Role, Search)'
      security:
        -
          BearerAuth: []
      parameters:
        -
          in: query
          name: role
          schema:
            type: string
            enum:
              - SUPERADMIN
              - MANAGEMENT
              - SUPERVISOR
              - RIDER
        -
          in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: 'List of Users'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: getUsers
    post:
      tags:
        - 'User Account'
      summary: 'Administrative User Creation (Enforces Role Hierarchy)'
      security:
        -
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        '201':
          description: 'User Created'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden (Hierarchy Guard Rejection)'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: postUsers
  '/users/{id}':
    get:
      tags:
        - 'User Account'
      summary: 'Get User Account Details'
      security:
        -
          BearerAuth: []
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'User Details'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: getUsersId
    put:
      tags:
        - 'User Account'
      summary: 'Update User Account (Profile, Role, Contact)'
      security:
        -
          BearerAuth: []
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                username:
                  type: string
                phone:
                  type: string
                role:
                  type: string
                  enum: [SUPERADMIN, MANAGEMENT, SUPERVISOR, RIDER]
      responses:
        '200':
          description: 'User Updated'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden (Cannot modify Superadmin account as Management)'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: putUsersId
    delete:
      tags:
        - 'User Account'
      summary: 'Deactivate or Delete User Account'
      security:
        -
          BearerAuth: []
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'User Deleted'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: deleteUsersId
  '/users/{id}/status':
    patch:
      tags:
        - 'User Account'
      summary: 'Toggle User Active Status'
      security:
        -
          BearerAuth: []
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_active
              properties:
                is_active:
                  type: boolean
      responses:
        '200':
          description: 'User Status Updated'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: patchUsersIdStatus
  /zones:
    get:
      tags:
        - 'Zone Master'
      summary: 'List All Spatial Zones with Polygon & Status'
      security:
        -
          BearerAuth: []
      responses:
        '200':
          description: 'GeoJSON/JSON Array of Operational Zones'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: getZones
    post:
      tags:
        - 'Zone Master'
      summary: 'Create New Operational Zone Polygon (SUPERADMIN ONLY)'
      security:
        -
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneInput'
      responses:
        '201':
          description: 'Zone Created with PostGIS Geometry'
        '400':
          description: 'Validation Failed (Overlap, Restricted Toll Road, Self-Intersection, or Area Out-of-Bounds)'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: postZones
  /zones/validate:
    post:
      tags:
        - 'Zone Master'
      summary: 'Pre-Validate Zone GeoJSON Polygon (Dry-Run PostGIS ST_IsValid & ST_Overlaps) (SUPERADMIN)'
      security:
        -
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - polygon
              properties:
                polygon:
                  type: object
                  description: 'GeoJSON Polygon Object'
                name:
                  type: string
                exclude_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: 'Validation Result with Validity and Overlap Flags'
  '/zones/{id}':
    get:
      tags:
        - 'Zone Master'
      summary: 'Get Specific Zone Details with Spatial Validation Reasons'
      security:
        -
          BearerAuth: []
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Zone Object'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: getZonesId
    put:
      tags:
        - 'Zone Master'
      summary: 'Update Zone Master Data & Polygon (SUPERADMIN ONLY)'
      security:
        -
          BearerAuth: []
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneInput'
      responses:
        '200':
          description: 'Zone Updated'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: putZonesId
    delete:
      tags:
        - 'Zone Master'
      summary: 'Delete Zone (SUPERADMIN ONLY)'
      security:
        -
          BearerAuth: []
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Zone Deleted'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: deleteZonesId
  '/zones/{id}/status':
    patch:
      tags:
        - 'Zone Master'
      summary: 'Toggle Zone Status (SUPERADMIN)'
      security:
        -
          BearerAuth: []
      parameters:
        -
          in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE, MAINTENANCE]
      responses:
        '200':
          description: 'Zone Status Updated'
  /dss/bwm/calculate:
    post:
      tags:
        - 'DSS Engine'
      summary: 'Execute Best-Worst Method (BWM) Linear Programming Solver (SUPERADMIN ONLY)'
      security:
        -
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - best_criteria_id
                - worst_criteria_id
                - best_to_others
                - worst_to_others
              properties:
                name:
                  type: string
                  example: 'Bobot BWM Q3 Sidoarjo 2026'
                best_criteria_id:
                  type: string
                  format: uuid
                worst_criteria_id:
                  type: string
                  format: uuid
                best_to_others:
                  type: object
                  description: 'Pairwise comparisons 1-9 from Best to Others'
                worst_to_others:
                  type: object
                  description: 'Pairwise comparisons 1-9 from Others to Worst'
      responses:
        '200':
          description: 'BWM Weights Computed Successfully (Consistency Ratio CR <= 0.10)'
        '400':
          description: 'Inconsistent Preferences (CR > 0.10)'
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: postDssBwmCalculate
  /dss/bwm/preview-impact:
    post:
      tags:
        - 'DSS Engine'
      summary: 'Preview & Simulate BWM Weight Impact on TOPSIS Zone Rankings without Saving (SUPERADMIN, SUPERVISOR, MANAGEMENT)'
      description: "Performs what-if simulation to project TOPSIS zone rankings when BWM weights change, without committing changes to the database. Supports either raw custom weights or BWM pairwise comparisons.\n"
      security:
        -
          BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                time_slot:
                  type: string
                  enum: [pagi, siang, sore, malam]
                  default: pagi
                weights:
                  type: object
                  description: 'Optional direct criteria weights map (e.g. { C1: 0.25, C2: 0.15, ... })'
                  example: {C1: 0.25, C2: 0.15, C3: 0.2, C4: 0.15, C5: 0.1, C6: 0.15}
                best_criteria_id:
                  type: string
                  format: uuid
                worst_criteria_id:
                  type: string
                  format: uuid
                best_to_others:
                  type: object
                worst_to_others:
                  type: object
      responses:
        '200':
          description: 'Simulation Result with Projected TOPSIS Zone Rankings'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: success}
                  time_slot: {type: string, example: pagi}
                  total_zones: {type: integer, example: 5}
                  rankings: {type: array, items: {type: object, properties: {rank: {type: integer, example: 1}, zone_id: {type: string, format: uuid}, zone_name: {type: string, example: 'Zona Alun-Alun Sidoarjo'}, topsis_score: {type: number, example: 0.8421}, category: {type: string, example: SANGAT_DIREKOMENDASIKAN}}}}
        '401':
          description: 'Unauthorized - Invalid or expired JWT token'
        '403':
          description: 'Forbidden - Insufficient role permissions or hierarchy guard rejection'
        '500':
          description: 'Internal Server Error - Unexpected server exception'
      operationId: postDssBwmPreview-impact
  /dss/bwm/active:
    get:
      tags:
        - 'DSS Engine'
      summary: 'Get Currently Active BWM Criteria Weights & Thresholds (SUPERADMIN, SUPERVISOR)'
      security:
        -
          BearerAuth: []
      responses:
