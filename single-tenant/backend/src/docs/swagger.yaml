components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Standard JSON Web Token (JWT) authorization header. Format: `Bearer <access_token>`'
    CookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: 'HTTP-Only secure cookie containing the session refresh token.'
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 'Unique resource identifier (UUIDv4)'
    ZoneIdPath:
      name: zone_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 'Target operational zone UUIDv4 identifier'
    DateQuery:
      name: date
      in: query
      required: false
      schema:
        type: string
        format: date
        example: '2026-09-16'
      description: 'Target operational date in YYYY-MM-DD format'
    TimeSlotQuery:
      name: time
      in: query
      required: false
      schema:
        type: string
        enum:
          - pagi
          - siang
          - sore
          - malam
        example: pagi
      description: 'Operational time window slot for DSS evaluation'
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: 'Maximum number of records to return in a single page'
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
      description: 'Pagination page index'
    SearchQuery:
      name: search
      in: query
      required: false
      schema:
        type: string
      description: 'Full-text search keyword query'
  responses:
    SuccessEnvelope:
      description: 'Standard successful response envelope'
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
                example: 'Operation completed successfully'
              data:
                type: object
    CreatedEnvelope:
      description: 'Resource created successfully'
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
                example: 'Resource created successfully'
              data:
                type: object
    BadRequestError:
      description: 'Bad Request - Invalid payload parameters or malformed syntax'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: 'Unauthorized - Missing, invalid, or expired JWT access token'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: 'Forbidden - Insufficient role permissions or RBAC hierarchy guard violation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: 'Not Found - Requested entity does not exist in the system'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: 'Conflict - State collision, duplicate key, or expired resource reservation lock'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 'Validation Error - Schema validation failed on input attributes'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimitError:
      description: 'Too Many Requests - Rate limit exceeded. Please back off before retrying.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: 'Internal Server Error - Unhandled system exception'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: 'An error occurred during request execution'
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            details:
              type: array
              items:
                type: string
        timestamp:
          type: string
          format: date-time
          example: '2026-09-16T09:17:32.000Z'
    GeoJSONPoint:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Point
          example: Point
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
          example:
            - 112.7166
            - -7.4478
          description: '[longitude, latitude] in WGS84 coordinates'
    GeoJSONPolygon:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          type: string
          enum:
            - Polygon
          example: Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 2
          example:
            -
              -
                - 112.716
                - -7.447
              -
                - 112.72
                - -7.447
              -
                - 112.72
                - -7.45
              -
                - 112.716
                - -7.45
              -
